name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g., 1.1)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  test-and-verify:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install Gradle 8.5
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release.jks

    - name: Parse Version Code from Input
      run: |
        VERSION_NAME="${{ github.event.inputs.version }}"
        VERSION_CODE=$(echo "$VERSION_NAME" | tr -d '.')
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

    - name: Build Signed Release APK for Testing
      run: ./gradlew assembleRelease -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ github.event.inputs.version }}
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Run Emulator & Check for Errors
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: arm64-v8a
        profile: tv_1080p
        script: |
          echo "Waiting for emulator to become available..."
          adb wait-for-device
          
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            echo "Waiting for emulator boot sequence to complete..."
            sleep 5
          done
          
          echo "Emulator is fully booted and responsive."

          # 1. Clear logcat and stream logs to a file in the background
          adb logcat -c
          adb logcat -v time > logcat_output.txt &
          LOGCAT_PID=$!

          # 2. Install the signed release APK
          adb install -r app/build/outputs/apk/release/app-release.apk

          # 3. Launch the app
          echo "Launching app..."
          adb shell am start -n com.example.messengerwrapper/.MainActivity

          # 4. Wait for initialization and WebView rendering
          sleep 12

          # 5. Stop logcat background process
          kill $LOGCAT_PID || true

          # 6. Check if process is still alive (guards against SIG 9 / silent exits)
          if ! adb shell pidof com.example.messengerwrapper; then
            echo "=========================================="
            echo "❌ ERROR: App process died or was killed (SIG 9)!"
            echo "=========================================="
            cat logcat_output.txt
            exit 1
          fi

          # 7. Scan logcat for fatal exceptions, crashes, or native errors
          if grep -E -i "fatal|androidruntime|sig: 9|killed|unhandled exception|unsatisfiedlinkerror" logcat_output.txt; then
            echo "=========================================="
            echo "❌ ERROR: Crash signatures found in logcat!"
            echo "=========================================="
            cat logcat_output.txt
            exit 1
          fi

          echo "=========================================="
          echo "✅ SUCCESS: App booted and ran without errors!"
          echo "=========================================="

  release:
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install Gradle 8.5
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release.jks

    - name: Parse Version Code from Input
      run: |
        VERSION_NAME="${{ github.event.inputs.version }}"
        VERSION_CODE=$(echo "$VERSION_NAME" | tr -d '.')
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

    - name: Build Release APK
      run: ./gradlew assembleRelease -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ github.event.inputs.version }}
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Generate and Push update.json
      run: |
        VERSION="${{ github.event.inputs.version }}"
        TAG="v$VERSION"
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"

        cat << EOF2 > update.json
        {
          "versionCode": ${{ env.VERSION_CODE }},
          "versionName": "$VERSION",
          "apkUrl": "https://github.com/$REPO_OWNER/$REPO_NAME/releases/download/$TAG/app-release.apk"
        }
        EOF2

        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add update.json
        git commit -m "Auto-update update.json for version $VERSION"
        git push origin main

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        tag_name: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
