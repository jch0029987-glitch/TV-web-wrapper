name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g., 1.1)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK and CMake
      run: |
        sdkmanager "cmake;3.22.1" "ndk;25.2.9519653"

    - name: Install Gradle
      run: sudo apt-get update && sudo apt-get install -y gradle

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > app/release.jks

    - name: Parse Version Code from Input
      run: |
        VERSION_NAME="${{ github.event.inputs.version }}"
        VERSION_CODE=$(echo "$VERSION_NAME" | tr -d '.')
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

    - name: Build Release APK
      run: ./gradlew assembleRelease -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ github.event.inputs.version }}
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Generate and Push update.json
      run: |
        VERSION="${{ github.event.inputs.version }}"
        TAG="v$VERSION"
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"

        cat << EOF > update.json
        {
          "versionCode": ${{ env.VERSION_CODE }},
          "versionName": "$VERSION",
          "apkUrl": "https://github.com/$REPO_OWNER/$REPO_NAME/releases/download/$TAG/app-release.apk"
        }
        EOF

        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add update.json
        git commit -m "Auto-update update.json for version $VERSION"
        git push origin main

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        tag_name: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
