name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g., 1.1)'
        required: true
        default: '1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Install Gradle
      run: sudo apt-get update && sudo apt-get install -y gradle

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Generate and Push update.json
      run: |
        VERSION="${{ github.event.inputs.version }}"
        TAG="v$VERSION"
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"

        cat << EOF > update.json
        {
          "versionCode": ${{ github.run_number }},
          "versionName": "$VERSION",
          "apkUrl": "https://github.com/$REPO_OWNER/$REPO_NAME/releases/download/$TAG/app-debug.apk"
        }
        EOF

        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add update.json
        git commit -m "Auto-update update.json for version $VERSION"
        git push origin main

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        tag_name: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
